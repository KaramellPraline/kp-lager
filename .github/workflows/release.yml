name: Release

# Veröffentlichen: Version hochzählen (tools/release.py bump), committen, Tag pushen:
#   git tag v0.3.0 && git push origin v0.3.0
# Der Workflow prüft Tag == Version, testet, baut Windows-Installer und Docker-Image und
# legt ein GitHub-Release mit den Dateien an.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v0.3.0 (muss zur Version im Code passen)"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - id: v
        name: Tag und Version vergleichen
        run: echo "version=$(python3 tools/release.py check "$TAG")" >> "$GITHUB_OUTPUT"
      - run: python3 tools/release.py notes "$TAG" > /dev/null
        name: Changelog-Text vorhanden?
      - run: uv sync --group dev --group mcp
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy app
      - run: uv run python -m pytest -q --ignore=tests/test_cad.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - run: choco install innosetup -y --no-progress
      - shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          ./windows/build.ps1 -Version "${{ needs.test.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name (klein geschrieben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sortiersystem" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.test.outputs.version }}
            ${{ env.IMAGE }}:latest

  release:
    needs: [test, windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release.py notes "$TAG" > notes.md
          gh release create "$TAG" dist/*.exe --title "KP Lager ${TAG}" --notes-file notes.md
