name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Abhängigkeiten
        run: uv sync --group dev --group mcp
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typen
        run: uv run mypy app
      - name: Tests
        run: uv run python -m pytest -q --ignore=tests/test_cad.py
