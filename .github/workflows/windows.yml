name: Windows-Installer

# Testbau der Windows-Installer (manuell). Offizielle Releases: release.yml.
on:
  workflow_dispatch:
  push:   # läuft auch von Arbeits-Branches aus, ohne dass der Workflow schon auf main liegt
    paths: ["windows/**", "app/d30_bridge.py", "app/__init__.py", ".github/workflows/windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Bauen
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kp-lager-windows
          path: dist/installer/*.exe
