# KP Lager mit HTTPS (Caddy, eigene CA). Start: docker compose up -d --build (im Ordner deploy/)
name: kp-lager

services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      LAGER_BASE_URL: https://${LAGER_HOST:-lager.home.lan}
      LAGER_D30: "0"            # kein Bluetooth im Container
      LAGER_D30_BRIDGE: "${LAGER_D30_BRIDGE:-1}"  # Etiketten über den Windows-Client (PC-Bridge) drucken
      LAGER_BACKUP_EXTERN: ${LAGER_BACKUP_EXTERN:-}  # Ziel im Container, z. B. /backup-extern
    volumes:
      - ./data:/data
      # Externes Backup (NAS/USB): Host-Ordner einbinden und LAGER_BACKUP_EXTERN=/backup-extern setzen
      - ${LAGER_BACKUP_HOST_DIR:-./data/backup-extern}:/backup-extern

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAGER_HOST: ${LAGER_HOST:-lager.home.lan}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
