<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiketten {{ codes[0] if codes else '' }}–{{ codes[-1] if codes else '' }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    @page { size: A4; margin: 0; }
    .sheet { width: 210mm; height: 297mm; padding: {{ s.top }}mm {{ s.left }}mm; background: #fff; color: #000;
      display: grid; grid-template-columns: repeat({{ s.cols }}, {{ s.width }}mm);
      grid-auto-rows: {{ s.height }}mm; break-after: page; margin: 0 auto 16px; box-shadow: 0 0 4px #0004; }
    .label { display: flex; align-items: center; gap: 2mm; padding: 1.5mm 2mm; overflow: hidden; }
    .label svg { height: {{ s.height - 3 }}mm; width: {{ s.height - 3 }}mm; flex: none; }
    .label b { font: 700 7mm/1 system-ui, sans-serif; letter-spacing: .5mm; }
    .label small { display: block; font-size: 2.6mm; color: #444; }
    @media print { .no-print { display: none; } body { background: #fff; } .sheet { box-shadow: none; margin: 0; } }
  </style>
</head>
<body>
  <main class="no-print">
    <a href="/">← Lager</a>
    <h1>Etiketten drucken</h1>
    <form method="get" class="stack">
      <div class="row">
        <label>Ab Nr. <input name="start" value="{{ start }}" inputmode="numeric" class="short"></label>
        <label>Anzahl <input name="count" value="{{ count }}" inputmode="numeric" class="short"></label>
      </div>
      <details><summary>Bogenformat (mm)</summary>
        <div class="row">
          <label>Spalten <input name="cols" value="{{ s.cols }}" class="short"></label>
          <label>Zeilen <input name="rows" value="{{ s.rows }}" class="short"></label>
        </div>
        <div class="row">
          <label>Breite <input name="width" value="{{ s.width }}" class="short"></label>
          <label>Höhe <input name="height" value="{{ s.height }}" class="short"></label>
        </div>
        <div class="row">
          <label>Rand oben <input name="top" value="{{ s.top }}" class="short"></label>
          <label>Rand links <input name="left" value="{{ s.left }}" class="short"></label>
        </div>
      </details>
      <button>Vorschau aktualisieren</button>
    </form>
    <p>Drucken mit 100 % Skalierung (nicht „an Seite anpassen“). Unbenutzte Codes werden beim ersten Scan angelegt.</p>
    <div class="row">
      <button class="primary" onclick="window.print()">Drucken</button>
      <form method="post" action="/labels/printed">
        <input type="hidden" name="last" value="{{ last }}">
        <button>Bis {{ codes[-1] if codes else '' }} als gedruckt merken</button>
      </form>
    </div>
  </main>
  {% for page in pages %}
  <div class="sheet">
    {% for code, svg in page %}
    <div class="label">{{ svg|safe }}<div><b>{{ code }}</b><small>Lager</small></div></div>
    {% endfor %}
  </div>
  {% endfor %}
</body>
</html>
